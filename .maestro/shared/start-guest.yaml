appId: com.thebradleyproject.sequins
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Continue as Guest.*"
    timeout: 15000
# The guest link is the right-hand words of one sentence; tap on the words themselves.
- tapOn:
    point: "61%,60%"
- runFlow:
    when:
      visible: ".*Continue as Guest.*"
    commands:
      - tapOn:
          id: "guest-button"
          optional: true
- extendedWaitUntil:
    visible: "(Get Started.*|Discover(,.*)?)"
    timeout: 15000
- runFlow:
    when:
      visible: "Get Started.*"
    commands:
      - tapOn: "Fan"
      - tapOn: "Get Started.*"
- extendedWaitUntil:
    visible: "Discover(,.*)?"
    timeout: 15000
